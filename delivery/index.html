<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Point do Hambúrguer - Lanches artesanais em Altinho-PE." />

  <meta name="theme-color" content="#ff4500" />

  <title>Delivery | Point do Hambúrguer</title>

  <link rel="icon" type="image/png" href="../assets/point.png" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main id="inicio">
    <section class="container" aria-labelledby="titulo-loja">
      <div class="box">
        <!-- ==================================================
                     LOGO
                ================================================== -->
        <div class="logo-container">
          <img src="../assets/point.png" alt="Logo do Point do Hambúrguer" class="bv-logo" />
        </div>
        <!-- ==================================================
                     TÍTULO
                ================================================== -->
        <h1 id="titulo-loja" class="bv-titulo">
          🛵 Delivery | Cardápio Digital
        </h1>
        <!-- SUBTÍTULO -->
        <p class="bv-subtitulo">Faça seu pedido diretamente aqui</p>
        <!-- ==================================================
                     DIVISOR
          ================================================== -->

        <div class="bv-divisor" aria-hidden="true"></div>

        <!-- ==================================================
       CARDÁPIO
       ================================================== -->
        <div class="container" id="cardapio">
          <!-- ==================================================
       BARRA DE PESQUISA
       ================================================== -->
          <div class="busca">
            <input type="text" id="busca-input" placeholder="🔍 Buscar lanche..." autocomplete="off" />
          </div>

          <div class="filtros">
            <button class="filtro-btn ativo" data-categoria="todos">
              Todos
            </button>
            <button class="filtro-btn" data-categoria="lanches">
              Lanches
            </button>
            <button class="filtro-btn" data-categoria="bebidas">
              Bebidas
            </button>
            <button class="filtro-btn" data-categoria="sobremesas">
              Sobremesas
            </button>
          </div>

          <div class="lista-itens" id="lista-itens">
            <!-- Os itens serão inseridos aqui via JavaScript (Supabase) -->
          </div>
        </div>

        <!-- ==================================================
       CARRINHO (fixo lateral/inferior)
       ================================================== -->
        <aside class="carrinho" id="carrinho">
          <h2>Seu Pedido</h2>

          <div class="carrinho-itens" id="carrinho-itens">
            <p class="carrinho-vazio">Seu carrinho está vazio</p>
          </div>

          <div class="carrinho-total">
            <span>Total:</span>
            <strong id="carrinho-total-valor">R$ 0,00</strong>
          </div>

          <button id="btn-finalizar" class="btn-finalizar">
            Finalizar Pedido
          </button>
        </aside>

        <!-- ==================================================
       MODAL - DADOS DO CLIENTE / ENDEREÇO
       ================================================== -->
        <div class="modal" id="modal-pedido">
          <div class="modal-conteudo">
            <button class="modal-fechar" id="modal-fechar">&times;</button>

            <h2>Finalizar Pedido</h2>

            <form id="form-pedido">
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" name="nome" required />

              <label for="telefone">WhatsApp</label>
              <input type="tel" id="telefone" name="telefone" required placeholder="(81) 9xxxx-xxxx" />

              <label for="endereco">Endereço</label>
              <input type="text" id="endereco" name="endereco" required placeholder="Rua, número, bairro" />

              <label for="referencia">Ponto de referência</label>
              <input type="text" id="referencia" name="referencia" />

              <label for="forma-pagamento">Forma de pagamento</label>
              <select id="forma-pagamento" name="forma-pagamento" required>
                <option value="">Selecione</option>
                <option value="pix">Pix</option>
                <option value="dinheiro">Dinheiro</option>
                <option value="cartao">Cartão (na entrega)</option>
              </select>

              <label for="observacoes">Observações</label>
              <textarea id="observacoes" name="observacoes" rows="2"></textarea>

              <button type="submit" class="btn-finalizar">
                Confirmar Pedido
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ==================================================
       SUPABASE (SDK via CDN — precisa vir ANTES do script.js)
       ================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->
  <script src="script.js"></script>
</body>

</html>
